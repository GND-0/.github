# Standard labels for every GND-0 repository.
# Applied org-wide by scripts/setup-org.sh (in the community kit) and kept in sync
# for this repo by .github/workflows/sync-labels.yml.
# Format: name, color (hex without #), description.

# ── Type ─────────────────────────────────────────────
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: enhancement"
  color: "a2eeef"
  description: "New feature or improvement"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation or learning material"
- name: "type: test"
  color: "bfd4f2"
  description: "Testbenches, assertions, coverage"
- name: "type: question"
  color: "d876e3"
  description: "Needs clarification (prefer Discussions → Q&A)"
- name: "type: event"
  color: "f9a03f"
  description: "Workshop, talk, hackathon or study circle"
- name: "type: membership"
  color: "c5def5"
  description: "Org membership request"
- name: "type: repo request"
  color: "c5def5"
  description: "Request for a new org repository"
- name: "type: chore"
  color: "ededed"
  description: "Maintenance, CI, housekeeping"

# ── Area / domain ───────────────────────────────────
- name: "area: rtl"
  color: "5319e7"
  description: "RTL / digital design"
- name: "area: verification"
  color: "6f42c1"
  description: "Verification and testbenches"
- name: "area: physical-design"
  color: "8a63d2"
  description: "Synthesis, STA, P&R, tapeout"
- name: "area: analog"
  color: "b392f0"
  description: "Analog / mixed-signal / custom layout"
- name: "area: fpga"
  color: "7057ff"
  description: "FPGA prototyping"
- name: "area: website"
  color: "1d76db"
  description: "Club website / Sanity studio"
- name: "area: learning"
  color: "0e8a16"
  description: "Learning roadmap and tutorials"
- name: "area: ci"
  color: "fbca04"
  description: "GitHub Actions and build flow"

# ── Status ──────────────────────────────────────────
- name: "status: needs triage"
  color: "ffffff"
  description: "Awaiting maintainer review"
- name: "status: accepted"
  color: "0e8a16"
  description: "Approved and ready to be worked on"
- name: "status: in progress"
  color: "fbca04"
  description: "Someone is working on it"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on something else"
- name: "status: needs info"
  color: "fef2c0"
  description: "More information requested from the author"
- name: "status: wontfix"
  color: "cccccc"
  description: "Will not be worked on"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Already reported"

# ── Priority ────────────────────────────────────────
- name: "priority: high"
  color: "b60205"
  description: "Important or urgent"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

# ── Contributor-friendly ────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers, mentor available"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "mentor available"
  color: "c2e0c6"
  description: "A maintainer will guide whoever picks this up"
- name: "hacktoberfest"
  color: "ff7518"
  description: "Eligible for Hacktoberfest"

# ── Discussions ─────────────────────────────────────
- name: "introduction"
  color: "e99695"
  description: "Member introductions"
