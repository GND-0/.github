name: 🐛 Bug report
description: Something is broken, such as a design that fails simulation, a script that errors, or a website bug.
title: "[Bug]: "
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](../issues?q=is%3Aissue) first.
        **Security problems:** don't file here. See [SECURITY.md](https://github.com/GND-0/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "e.g. `fifo_full` asserts one cycle late when wr_en and rd_en are both high"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands you ran, test name, page URL, or a minimal code snippet.
      placeholder: |
        1. make sim TEST=tb_fifo
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste text output, which is formatted automatically. Attach waveform or UI screenshots below if helpful.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, tool and version (e.g. Ubuntu 24.04, Icarus Verilog 12, Verilator 5.x, LibreLane 3.x, sky130A), or browser for website bugs.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Area
      options:
        - RTL / digital design
        - Verification / testbench
        - Physical design / flow
        - Analog / custom layout
        - FPGA
        - Website / Sanity
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have not included any secrets, NDA material or proprietary PDK/tool files.
          required: true
