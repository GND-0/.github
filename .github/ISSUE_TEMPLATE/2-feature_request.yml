name: ✨ Feature / enhancement
description: Suggest an improvement to an existing project, such as a new module feature, test, doc page or website feature.
title: "[Feature]: "
labels: ["type: enhancement", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What's missing or painful today? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Include interfaces, block diagrams or mock-ups if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, assign me
        - Yes, but I need mentoring
        - No, just suggesting
    validations:
      required: true
