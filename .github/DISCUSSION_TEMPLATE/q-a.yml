body:
  - type: markdown
    attributes:
      value: |
        Tips: use a specific title, include a **minimal** code example and the **exact** error text. See [SUPPORT.md](https://github.com/GND-0/.github/blob/main/SUPPORT.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Digital logic / theory", "Verilog / SystemVerilog", "Verification (UVM, cocotb, formal)", "FPGA", "Synthesis / STA", "Physical design / LibreLane / OpenROAD", "Analog / layout / SPICE", "Tool installation", "Careers / internships", "Other"]
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what's going wrong?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code / logs
      render: verilog
  - type: input
    id: tools
    attributes:
      label: Tools and versions
      placeholder: "Icarus Verilog 12.0, GTKWave 3.3, Ubuntu 24.04"
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
